name: Record a live run

# Calls Claude for every case (agent and judge), saves the replies to recordings/,
# rebuilds the demo page from them, and commits both. Needs the ANTHROPIC_API_KEY secret.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Live run (3 runs of 30 accounts, Claude agent + Claude judge)
        # live only in this step; the demo rebuild below must replay the recording, not call Claude again
        env:
          GOLIVE_LIVE: "1"
        run: |
          test -n "$ANTHROPIC_API_KEY" || { echo "Set the ANTHROPIC_API_KEY repo secret first"; exit 1; }
          rm -f recordings/agent.jsonl recordings/judge.jsonl
          set +e
          golive run evals/golive.live.yml --out reports/live
          code=$?
          set -e
          cat reports/live/report.md >> "$GITHUB_STEP_SUMMARY"
          # 0 go, 1 no-go, 2 partial are all results worth keeping; 3 is a config error
          test "$code" -ne 3
          # keep only a complete recording: 90 agent calls (30 accounts x 3 runs), none crashed
          if [ "$(wc -l < recordings/agent.jsonl)" -ne 90 ]; then
            echo "incomplete recording, not committing. Agent errors:"
            python -c "import json; r = json.load(open('reports/live/results.json')); print('\n'.join(sorted({x['error'][:300] for c in r['cases'] for x in c['runs'] if x['error']})))"
            exit 1
          fi
      - name: Rebuild the demo page from the recording
        run: bash scripts/build_demo.sh
      - name: Commit the recording
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add recordings docs
          git commit -m "Record live run" || echo "nothing to commit"
          git push
          # pushes made with GITHUB_TOKEN do not start CI; the next push by a person does
      - name: Republish the demo page (gh-pages branch)
        run: |
          git fetch origin gh-pages || true
          git subtree split --prefix docs -b gh-pages-new
          git push -f origin gh-pages-new:gh-pages
