[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "outbound-autosend-gate"
version = "0.1.0"
description = "Go-live gate for an AI outbound sales agent, with a per-step auto-send ladder"
requires-python = ">=3.10"
dependencies = [
  "golive-gate[claude]==0.1.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
packages = ["outbound"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["outbound"]
known-third-party = ["golive_gate"]

[tool.ruff.lint.per-file-ignores]
"scripts/build_demo.py" = ["E501"]  # the page template
